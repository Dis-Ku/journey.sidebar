<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Journey Sidebar</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="toolbar">
      <span id="dateLabel"></span>
      <span class="spacer"></span>
      <button id="settingsBtn" title="設定">⚙</button>
    </div>

    <main>
      <input id="titleInput" type="text" placeholder="タイトル（省略可）" autocomplete="off" />
      <textarea id="bodyInput" placeholder="今日のできごとを書く…"></textarea>
      <div id="actions">
        <span id="draftHint">下書きは自動保存されます</span>
        <button id="sendBtn">Journeyに送信</button>
      </div>
      <p id="status" role="status"></p>
    </main>

    <script src="common.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
